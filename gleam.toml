name = "franska"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
description = "A web tool for Swedish speakers to practise French (A1/A2)"
licences = ["MIT"]
repository = { type = "github", user = "nerggnet", repo = "franska" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"

[tools.lustre.html]
lang = "sv"
title = "Franska"
stylesheets = [{ href = "franska.css" }]
meta = [
  { name = "theme-color", content = "#1f4fa3" },
  { name = "description", content = "Öva franska från svenska, en fras i taget" },
]
links = [
  { rel = "manifest", href = "manifest.webmanifest" },
  { rel = "icon", href = "icon.svg", type = "image/svg+xml" },
  { rel = "apple-touch-icon", href = "apple-touch-icon.png" },
]
